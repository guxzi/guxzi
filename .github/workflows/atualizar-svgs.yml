name: Atualizar artes do perfil

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia às 03:17 (horário de Brasília)
  workflow_dispatch:         # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/atualizar-svgs.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-svgs
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/gerar_svgs.py

      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && echo "Nada mudou." && exit 0
          git commit -m "Atualiza artes do perfil [skip ci]"
          git push
