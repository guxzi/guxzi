<defs>
  <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#140f24"/><stop offset="1" stop-color="#0d1326"/>
  </linearGradient>
  <linearGradient id="pop" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff4fa3"/><stop offset=".55" stop-color="#9b5cff"/><stop offset="1" stop-color="#3ddcff"/>
  </linearGradient>
  <linearGradient id="popv" x1="0" y1="1" x2="0" y2="0">
